<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a1f4e"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#080d20"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Subtle cosmic stars -->
  <circle cx="90" cy="120" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="510" cy="140" r="2" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="140" cy="460" r="3" fill="#818cf8" opacity="0.7"/>
  <circle cx="480" cy="430" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="300" cy="80" r="2" fill="#e0e7ff" opacity="0.6"/>

  <!-- Halo aura -->
  <circle cx="300" cy="250" r="130" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.35" stroke-dasharray="8 6"/>

  <!-- Friendly Silhouette -->
  <!-- Head -->
  <circle cx="300" cy="225" r="85" fill="#1e2448" stroke="url(#glow)" stroke-width="3"/>
  <!-- Smile/eyes subtle motif -->
  <path d="M 270 240 Q 300 265 330 240" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  <!-- Body/Shoulders -->
  <path d="M 170 450 C 180 340, 240 330, 300 330 C 360 330, 420 340, 430 450 Z" fill="#181e3e" stroke="url(#glow)" stroke-width="3"/>

  <!-- Camera / Surprise badge -->
  <g transform="translate(300, 475)">
    <rect x="-170" y="-30" width="340" height="60" rx="30" fill="rgba(196, 181, 253, 0.15)" stroke="url(#glow)" stroke-width="1.5"/>
    <text x="0" y="8" fill="#f1f5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      📷 Your Photo Here (assets/my-photo.jpg)
    </text>
  </g>
</svg>
